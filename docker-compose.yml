services:
  app:
    build: ./backend
    container_name: app
    ports:
      - "80:5000"
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:

